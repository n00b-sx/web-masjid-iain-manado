name: Build APK Smart TV Masjid

on:
  workflow_dispatch:
    inputs:
      tv_url:
        description: 'URL Halaman Layar TV Server Masjid'
        required: false
        default: 'https://aljamiah.iain-manado.ac.id/tv?kiosk=1'
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Smart TV APK
        working-directory: ./android-tv
        env:
          INPUT_TV_URL: ${{ github.event.inputs.tv_url }}
        run: |
          if [ -n "$INPUT_TV_URL" ]; then
            gradle assembleDebug --no-daemon -PTV_SERVER_URL="$INPUT_TV_URL"
          else
            gradle assembleDebug --no-daemon
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../tv-masjid-al-jamiah.apk

      - name: Upload TV APK Artifact (Siap Diunduh)
        uses: actions/upload-artifact@v4
        with:
          name: tv-masjid-al-jamiah-apk
          path: tv-masjid-al-jamiah.apk
          retention-days: 90
