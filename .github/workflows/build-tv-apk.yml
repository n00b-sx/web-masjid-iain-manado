name: Build APK Smart TV Masjid

on:
  workflow_dispatch:
    inputs:
      tv_url:
        description: 'URL Halaman Layar TV Server Masjid'
        required: false
        default: 'https://aljamiah.iain-manado.ac.id/tv?kiosk=1'
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'

jobs:
  build-tv-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK & Gradle 8.7
        run: |
          set -e
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR/cmdline-tools" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          fi
          CMDLINE_BIN=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$CMDLINE_BIN" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$CMDLINE_BIN" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$SDK_DIR" > android-tv/local.properties
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Smart TV APK
        working-directory: ./android-tv
        env:
          INPUT_TV_URL: ${{ github.event.inputs.tv_url }}
        run: |
          if [ -n "$INPUT_TV_URL" ]; then
            gradle assembleDebug --no-daemon --stacktrace -PTV_SERVER_URL="$INPUT_TV_URL"
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../tv-masjid-al-jamiah.apk

      - name: Upload TV APK Artifact (Siap Diunduh)
        uses: actions/upload-artifact@v4
        with:
          name: tv-masjid-al-jamiah-apk
          path: tv-masjid-al-jamiah.apk
          retention-days: 90
